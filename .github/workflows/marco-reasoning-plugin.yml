name: MARCO reasoning plugin

on:
  pull_request:
    paths:
      - "plugins/marco-reasoning/**"
      - "tests/test_marco_reasoning_plugin.py"
      - ".github/workflows/marco-reasoning-plugin.yml"
      - ".replit"
  push:
    branches:
      - "feature/marco-reasoning-plugin"
    paths:
      - "plugins/marco-reasoning/**"
      - "tests/test_marco_reasoning_plugin.py"
      - ".github/workflows/marco-reasoning-plugin.yml"

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install plugin and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r plugins/marco-reasoning/requirements.txt pytest pytest-xdist pyyaml

      - name: Run adapter unit tests
        run: python -m pytest -q tests/test_marco_reasoning_plugin.py

      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path("plugins/marco-reasoning")
          json.loads((root / "plugin.json").read_text(encoding="utf-8"))
          json.loads((root / "mcp.json").read_text(encoding="utf-8"))
          yaml.safe_load((root / "skills/marco-reasoning/agents/openai.yaml").read_text(encoding="utf-8"))
          import tomllib
          tomllib.loads(Path(".replit").read_text(encoding="utf-8"))
          PY

      - name: Smoke import MCP server
        run: |
          python -m py_compile \
            plugins/marco-reasoning/server.py \
            plugins/marco-reasoning/marco_reasoning/contracts.py \
            plugins/marco-reasoning/marco_reasoning/runtime.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("plugins/marco-reasoning/server.py").resolve()
          spec = importlib.util.spec_from_file_location("marco_reasoning_server", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.mcp.name == "marco-reasoning"
          PY
