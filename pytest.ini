[pytest]
# The default run is parallel.  ``--dist loadfile`` keeps every test in a file
# on one worker: these tests share process-level state (the selected language
# pack, the encoder cache, the overlay), and splitting one file across workers
# reorders tests that were written to run in order.
#
# Temp files go to a gitignored folder inside the repo, so a run leaves nothing
# in the system temp folder and a failed run can still be looked at.
addopts = -n auto --dist loadfile --basetemp=.pytest_tmp
testpaths = tests

markers =
    language(name): run this test with that language pack selected, exactly as NAI_LANGUAGE=<name> selects it outside tests
